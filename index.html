<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Descubra o Seu Signo ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="stars2" aria-hidden="true"></div>
  <div class="twinkle" aria-hidden="true"></div>

  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Astrologia • Zodíaco</p>
      <h1>Descubra o seu <span>signo</span></h1>
      <p class="subtitle">Digite sua data de nascimento e veja o signo, o elemento e um pouco da sua energia.</p>
    </header>

    <section class="card" id="form-card">
      <label for="birthdate">Data de nascimento</label>
      <div class="input-row">
        <input type="date" id="birthdate" required />
        <button type="button" id="discover-btn">
          <span>Descobrir</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="hint">Usamos só o dia e o mês — o ano não importa.</p>
    </section>

    <section class="result hidden" id="result" aria-live="polite"></section>

    <footer>
      Feito com HTML, CSS e JavaScript · Só por diversão 🌙
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
