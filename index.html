<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santuário — Cavaleiros do Zodíaco</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cinzel+Decorative:wght@700;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="columns" aria-hidden="true"><span></span><span></span></div>

  <main class="wrap">
    <header class="hero">
      <p class="eyebrow">Santuário de Atena</p>
      <div class="athena-star">★</div>
      <h1>Cavaleiros do <span>Zodíaco</span></h1>
      <p class="subtitle">Descubra a Casa de Ouro que guarda o seu signo e a armadura que combina com o seu cosmo.</p>
    </header>

    <section class="card">
      <label for="birthdate">Data de nascimento do cavaleiro</label>
      <div class="input-row">
        <input type="date" id="birthdate" required />
        <button type="button" id="discover-btn">Despertar o Cosmo</button>
      </div>
      <p class="hint">O oráculo usa só o dia e o mês para abrir a Casa correspondente.</p>
    </section>

    <section class="houses" aria-hidden="true">
      <span>♈</span><span>♉</span><span>♊</span><span>♋</span>
      <span>♌</span><span>♍</span><span>♎</span><span>♏</span>
      <span>♐</span><span>♑</span><span>♒</span><span>♓</span>
    </section>

    <section class="result hidden" id="result" aria-live="polite"></section>
    <footer>Inspirado no universo dos Cavaleiros de Ouro · Feito com HTML, CSS e JS</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
